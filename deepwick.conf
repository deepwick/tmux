# Deepwick for tmux. Styles only: your status-left/right contents are untouched.
set -g status-style "fg=#D4D4D4,bg=#10192C"
set -g status-left-style "fg=#04041a,bg=#569CD6,bold"
set -g status-right-style "fg=#6E7899,bg=#10192C"
set -g window-status-style "fg=#6E7899,bg=#10192C"
set -g window-status-current-style "fg=#D4D4D4,bg=#1B2140,bold"
set -g window-status-activity-style "fg=#DCDCAA,bg=#10192C"
set -g window-status-bell-style "fg=#F44747,bg=#10192C,bold"
set -g pane-border-style "fg=#1B2140"
set -g pane-active-border-style "fg=#569CD6"
set -g message-style "fg=#D4D4D4,bg=#1B2140"
set -g message-command-style "fg=#DCDCAA,bg=#1B2140"
set -g mode-style "fg=#D4D4D4,bg=#264F78"
set -g copy-mode-match-style "bg=#264F78"
set -g copy-mode-current-match-style "fg=#D7BA7D,bg=#264F78,bold"
set -g clock-mode-colour "#569CD6"
set -g display-panes-colour "#6E7899"
set -g display-panes-active-colour "#569CD6"
set -g popup-border-style "fg=#569CD6"
set -g menu-border-style "fg=#569CD6"
