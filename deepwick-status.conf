# Deepwick status layout for tmux (https://github.com/deepwick/tmux).
# Needs a Nerd Font or a powerline-patched font; deepwick-status-plain.conf doesn't.
# Replaces status-left, status-right and the window formats. Load it after deepwick.conf.
# Generated by generate.py.
set -g status-justify left
set -g status-right-length 60
set -g status-left "#[fg=#04041a,bg=#569cd6,bold] #S #[fg=#569cd6,bg=#10192c,nobold,noitalics,nounderscore]"
set -g status-right "#[fg=#1b2140,bg=#10192c,nobold,noitalics,nounderscore]#[fg=#d4d4d4,bg=#1b2140] %Y-%m-%d #[fg=#d4d4d4,bg=#1b2140,nobold,noitalics,nounderscore]#[fg=#d4d4d4,bg=#1b2140] %H:%M #[fg=#4ec9b0,bg=#1b2140,nobold,noitalics,nounderscore]#[fg=#04041a,bg=#4ec9b0,bold] #H "
set -g window-status-format "#[fg=#10192c,bg=#1b2140,nobold,noitalics,nounderscore] #[fg=#{?window_bell_flag,#f44747,#{?window_activity_flag,#dcdcaa,#6e7899}},bg=#1b2140#{?window_bell_flag,#,bold,}]#I #[fg=#{?window_bell_flag,#f44747,#{?window_activity_flag,#dcdcaa,#6e7899}},bg=#1b2140,nobold,noitalics,nounderscore] #[fg=#{?window_bell_flag,#f44747,#{?window_activity_flag,#dcdcaa,#6e7899}},bg=#1b2140#{?window_bell_flag,#,bold,}]#W #F #[fg=#1b2140,bg=#10192c,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=#10192c,bg=#4ec9b0,nobold,noitalics,nounderscore] #[fg=#04041a,bg=#4ec9b0]#I #[fg=#04041a,bg=#4ec9b0,nobold,noitalics,nounderscore] #[fg=#04041a,bg=#4ec9b0]#W #F #[fg=#4ec9b0,bg=#10192c,nobold,noitalics,nounderscore]"
set -g window-status-separator ""
